name: Docker image

on:
  push:
    tags: ["v*"] # manual tag pushes (non-GITHUB_TOKEN) still trigger this path
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: Derive image tags
        id: meta
        run: |
          version="${REF#v}"
          tags="ghcr.io/zenn-g/konus-la:${version}"
          case "$version" in
            *-*) ;; # prerelease/test tags (v0.0.0-test) must not claim :latest
            *) tags="$tags,ghcr.io/zenn-g/konus-la:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
