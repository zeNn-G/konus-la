name: Release

on:
  push:
    branches: [main]

# Queue, never cancel: an in-flight run may be mid-tag/mid-release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against baseBranch history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Version PR or tag release
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun x changeset version
          # release-tag.sh owns the v-tag + GitHub Release; createGithubReleases
          # stays off so the action never pushes a konus-la@X.Y.Z tag of its own.
          publish: bash scripts/release-tag.sh
          createGithubReleases: false
          commit: "chore: version packages"
          title: "Version Packages"
          commitMode: github-api
        env:
          # App token: a GITHUB_TOKEN-authored release branch/PR never triggers
          # ci.yml, leaving the required `check` unreported.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }} # release-tag.sh's `gh release create`

  # Chained via workflow_call — release-tag.sh pushes the tag with checkout's
  # persisted GITHUB_TOKEN, which never triggers docker-image.yml's own push
  # event. Keep the app token out of actions/checkout or the image builds twice.
  build-image:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: v${{ fromJson(needs.release.outputs.publishedPackages)[0].version }}
